name: "Changelog"
on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

env:
  base-branch: main
  python-version: "3.12"
  path-frontend: packages/volto-authomatic

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Dependabot updates need no news fragment. Its pull requests also carry
    # the "skip changelog" label, but the author check does not depend on it.
    if: >-
      ${{
        !contains(github.event.pull_request.labels.*.name, 'skip changelog')
        && github.event.pull_request.user.login != 'dependabot[bot]'
      }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch all history
          fetch-depth: '0'

      - name: Setup uv
        uses: plone/meta/.github/actions/setup_uv@2.x
        with:
          python-version: ${{ env.python-version }}
          working-directory: '.'

      - name: "Fetch base branch"
        run: |
          # Reference: https://github.com/actions/checkout/#fetch-all-branches.
          git fetch --no-tags origin ${{ env.base-branch }}

      - name: "Frontend: Check"
        id: frontend-changelog
        run: |
          uvx towncrier check --compare-with origin/${{ env.base-branch }} --config ${{ env.path-frontend }}/towncrier.toml --dir ${{ env.path-frontend }}

      - name: "Report check"
        if: ${{ always() }}
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| frontend |${{ steps.frontend-changelog.conclusion }} |' >> $GITHUB_STEP_SUMMARY
